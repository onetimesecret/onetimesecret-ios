version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, github-actions]

  # No package dependencies today; this keeps Package.resolved honest if any
  # are added later.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, swift]
