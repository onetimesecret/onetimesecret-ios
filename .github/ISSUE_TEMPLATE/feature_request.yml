name: Feature request
description: Suggest an addition or change to the SDK's API
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch the Swift you would like to write.
      render: swift
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
